<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#102f3a">
    <meta
      name="description"
      content="Use a câmera e a voz para perguntar sobre uma imagem com o Meus Olhos."
    >
    <title>Meus Olhos | Assistência visual</title>
    <link rel="stylesheet" href="/user/styles.css">
  </head>
  <body>
    <main class="app" aria-labelledby="page-title">
      <a class="brand" href="/user/" aria-label="Meus Olhos, página inicial">
        <span class="brand-mark" aria-hidden="true">M</span>
        <span>MEUS OLHOS</span>
      </a>

      <h1 id="page-title">Assistência visual, por voz</h1>
      <p class="intro">
        Tire uma foto e pergunte o que gostaria de saber. A imagem é processada
        temporariamente e não fica armazenada.
      </p>

      <button id="open-camera" class="button button-primary" type="button">
        Abrir câmera
      </button>

      <section id="camera-section" class="flow-section" aria-label="Câmera" hidden>
        <video
          id="camera-preview"
          class="media-preview"
          playsinline
          muted
          aria-label="Prévia da câmera"
          hidden
        ></video>
        <div class="controls">
          <button id="capture-photo" class="button button-primary" type="button" hidden>
            Tirar foto
          </button>
          <button id="file-picker-button" class="button button-secondary" type="button" hidden>
            Tirar ou escolher uma foto
          </button>
          <input
            id="photo-file"
            class="visually-hidden"
            type="file"
            accept="image/jpeg,image/png,image/webp"
            capture="environment"
            aria-label="Tirar ou escolher uma foto JPEG, PNG ou WebP"
          >
        </div>
      </section>

      <section id="photo-section" class="flow-section" aria-label="Foto e pergunta" hidden>
        <img id="photo-preview" class="media-preview" alt="Prévia da foto escolhida">
        <p class="photo-hint">
          Diga sua pergunta quando ouvir o aviso. A foto será enviada ao serviço para respondê-la.
        </p>
        <form id="question-form" class="question-form">
          <label for="question">Ou digite sua pergunta</label>
          <textarea
            id="question"
            name="question"
            rows="2"
            maxlength="1000"
            autocomplete="off"
          ></textarea>
          <div class="controls">
            <button id="send-question" class="button button-primary" type="submit">
              Enviar pergunta
            </button>
            <button id="retake-photo" class="button button-secondary" type="button">
              Tirar outra foto
            </button>
            <button id="listen-again" class="button button-secondary" type="button" hidden>
              Tentar falar
            </button>
          </div>
        </form>
      </section>

      <section id="request-panel" class="flow-section request-panel" aria-live="polite" hidden>
        <p id="request-message"></p>
        <button id="cancel-request" class="button button-secondary" type="button" hidden>
          Cancelar pedido
        </button>
      </section>

      <p id="status" class="status" role="status" aria-live="polite" aria-atomic="true">
        Pronto para começar.
      </p>
      <p id="voice-status" class="visually-hidden" role="status" aria-live="assertive" aria-atomic="true"></p>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/user/app.js" defer></script>
  </body>
</html>
